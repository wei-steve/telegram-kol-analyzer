# AI 提供商 / 模型 / 按环节模型选择。生产文件是 config/ai_recognition.yaml。
#
# schema_version: 2 是三层结构：
#   providers  提供商 = 一个 OpenAI 兼容端点 + 一把 Key
#   models     模型   = 某个提供商下的一个模型名
#   stages     环节   → 有序模型 id 列表，第 1 个主用，后面是备用；
#                       主用失败会自动用下一个（见 docs/ARCHITECTURE.md 第 5.5 节）
#
# 一份**没有 schema_version 的旧文件仍然能直接用**：加载时会在内存里迁移成这个结构，
# 不会改写文件；在「AI提供商」页面上保存一次，文件才升级成 v2。
# 迁移按生产的真实行为映射，不是按旧页面的选择 —— 例如 authoritative_recognition
# 取的是 mimo-v2.5 那条，而不是 active_image_model_id（它是 glm-ocr）。
#
# 三个进程（web / ingest / worker）每次用到时重新读这个文件，页面保存后不需要重启。
# 上线前只读核对：telegram-kol-research ai-config-show
schema_version: 2
mode: ai_provider
providers:
- id: deepseek
  label: DeepSeek
  base_url: https://api.deepseek.com
  api_key: your_deepseek_api_key
  timeout_seconds: 60
  enabled: true
- id: zhipu
  label: 智谱
  base_url: https://open.bigmodel.cn/api/paas/v4
  api_key: your_zhipu_api_key
  timeout_seconds: 60
  enabled: true
- id: mimo
  label: MiMo
  base_url: https://api.xiaomimimo.com/v1
  api_key: your_xiaomi_mimo_api_key
  timeout_seconds: 60
  enabled: true
models:
- id: deepseek-v4-flash
  provider_id: deepseek
  model: deepseek-v4-flash
  label: DeepSeek V4 Flash
  supports_text: true
  supports_image: false
  enabled: true
- id: glm-ocr
  provider_id: zhipu
  model: glm-ocr
  label: GLM-OCR
  supports_text: false
  supports_image: true
  enabled: true
- id: mimo-v2.5
  provider_id: mimo
  model: mimo-v2.5
  label: MiMo V2.5
  supports_text: true
  supports_image: true
  enabled: true

# 每个环节能绑哪些模型，取决于它的能力要求：
#   authoritative_recognition  文本 + 图片（生产主路径）
#   context_resolution         文本（生产）
#   semantic_review            文本（生产，只读顾问）
#   strategy_alert             文本（生产，当 bot token 配置时）；空 = 沿用
#                              TELEGRAM_KOL_ALERT_LLM_MODEL / TELEGRAM_KOL_LLM_*
#   batch_text_recognition     文本（只有 CLI / 批量工具）
#   batch_image_recognition    图片（只有 CLI / 批量工具）
# runtime_incident_agent 不在这里配置：它有自己的 fail-closed 环境变量。
stages:
  authoritative_recognition:
  - mimo-v2.5
  context_resolution:
  - deepseek-v4-flash
  semantic_review:
  - deepseek-v4-flash
  strategy_alert: []
  batch_text_recognition:
  - deepseek-v4-flash
  batch_image_recognition:
  - glm-ocr

# 下面这组是 v1 字段的派生镜像。v2 的 providers / models / stages 才是权威，
# 保存时这几行会按 stages 重新算出来。留着它们只为一件事：万一回滚到 v2 之前的
# 代码，那份代码读到的仍然是一份能用的配置，而不是空配置。
active_text_model_id: deepseek-v4-flash
active_image_model_id: glm-ocr
context_resolution_model_id: deepseek-v4-flash
ai_models:
- id: deepseek-v4-flash
  label: DeepSeek V4 Flash
  base_url: https://api.deepseek.com
  api_key: your_deepseek_api_key
  model: deepseek-v4-flash
  timeout_seconds: 60
  supports_text: true
  supports_image: false
- id: glm-ocr
  label: GLM-OCR
  base_url: https://open.bigmodel.cn/api/paas/v4
  api_key: your_zhipu_api_key
  model: glm-ocr
  timeout_seconds: 60
  supports_text: false
  supports_image: true
- id: mimo-v2.5
  label: MiMo V2.5
  base_url: https://api.xiaomimimo.com/v1
  api_key: your_xiaomi_mimo_api_key
  model: mimo-v2.5
  timeout_seconds: 60
  supports_text: true
  supports_image: true
text_provider:
  base_url: https://api.deepseek.com
  api_key: your_deepseek_api_key
  model: deepseek-v4-flash
  timeout_seconds: 60
image_provider:
  base_url: https://open.bigmodel.cn/api/paas/v4
  api_key: your_zhipu_api_key
  model: glm-ocr
  timeout_seconds: 60

# 下面三段提示词是**一次性种子**：首次启动时会写进数据库里的提示词注册表，
# 之后线上生效的是注册表里的版本，改这里不再有效果（改「AI识别提示词」页面）。
recognition_prompt: "你是 Telegram 加密货币 KOL 消息的交易策略识别器。\n判断单条消息是否包含可执行的新开仓策略。\n\n只有同时满足这些条件，才判定为“是策略”：\n\
  1. 有明确交易标的，例如 BTC、ETH、SOL、DOGE、BNB。\n2. 有明确方向：多、做多、开多、long，或空、做空、开空、short。\n3. 有明确入场方式：价格、区间、市价、到价进入、挂单区间。\n\
  4. 至少有止损、止盈、无效价、保护价或分批止盈计划之一。\n5. 表达的是新开仓/新挂单/可执行入场，不是已有仓位管理。\n\n图片消息：请直接读取图片中的文字和图表标注，不要依赖外部 OCR。\n\
  \n只输出 JSON，不要输出解释文字：\n{\n  \"recognition_result\": \"是策略 | 非策略 | 识别失败\",\n  \"reason\": \"一句话说明原因\"\
  ,\n  \"strategy\": {\n    \"symbol\": null,\n    \"side\": null,\n    \"entry\": null,\n    \"stop_loss\"\
  : null,\n    \"take_profit\": null,\n    \"leverage\": null,\n    \"order_type\": null\n  },\n  \"confidence\"\
  : 0.0\n}\n字段要求：\n- strategy.order_type 只能输出 \"market\"、\"limit\" 或 \"market+limit\"。\n- 市价/现价/直接进场输出\
  \ \"market\"；限价/挂单/到价进场输出 \"limit\"；一部分市价先进、一部分挂单补仓输出 \"market+limit\"。\n"
lifecycle_event_prompt: "你是 Telegram 加密货币 KOL 策略生命周期事件判定器。\n你会收到：当前消息、同群最近的活跃策略列表、以及最近聊天上下文。\n\n你的任务不是识别新策略，而是判断“当前消息”是否在改变某一条已有策略的状态。\n\
  \n只允许输出 JSON，不要输出解释文本：\n{\n  \"event_type\": \"none | entry_confirm | cancel_entry | exit_position |\
  \ position_update\",\n  \"target_lifecycle_id\": null,\n  \"symbol\": null,\n  \"side\": null,\n  \"\
  entry_price\": null,\n  \"exit_price\": null,\n  \"stop_loss\": null,\n  \"take_profit\": null,\n  \"\
  management_action\": null,\n  \"confidence\": 0.0,\n  \"reason\": \"一句话说明判断依据\"\n}\n\n判定规则：\n- entry_confirm：当前消息是在通知之前\
  \ pending_entry 策略现在/现价/市价/直接入场，或明确说已经进场。\n- cancel_entry：当前消息是在取消之前 pending_entry 限价挂单或等待入场策略，例如取消限价、撤单、取消挂单、等后续信号。\n\
  - exit_position：当前消息是在关闭已 entered 策略，例如平仓、全平、离场、临时离场、止盈了、止损了、先出来、保本出局、成本附近保本出局、保本走、成本走、breakeven exit。\n\
  - position_update：当前消息是在管理已 entered 策略但没有完全离场，例如提前止盈一半、止盈一半、减仓一半、带保护、保护止损、上移止损、推保护、继续持有。management_action\
  \ 可输出 partial_take_profit、move_stop_to_protect、hold_update、risk_update。\n- 如果当前消息明确调整止损价，请输出 stop_loss；明确调整止盈价或止盈计划，请输出\
  \ take_profit；只是“推保护/带保护/保本”但没有新价格时，management_action 输出 move_stop_to_protect。\n- 临时入场、临时离场、部分止盈、调整止盈价、调整止损价都属于生命周期事件，不要当成新的\
  \ strategy。\n- none：普通聊天、行情观点、广告、复盘、联系方式、无法确定目标策略、或只是识别新策略但不改变已有策略。\n- 必须优先依据当前消息，不要把上下文里的旧消息当成当前动作。\n\
  - 如果能明确对应活跃策略，请输出 target_lifecycle_id。\n- 如果不能唯一对应，event_type 必须为 none 或 confidence 低于 0.7。\n- confidence\
  \ 低于 0.7 时，系统不会执行状态变更。\n"
mimo_direct_prompt: '你是 Telegram 加密货币 KOL 消息的多模态交易策略识别器。

  你会收到一条消息的文字/图片。请只判断当前这条消息是否包含“新的、可执行的开仓策略”。


  必须判定为“是策略”的条件：

  1. 有明确交易标的，例如 BTC、ETH、SOL、DOGE、BNB 等。

  2. 有明确方向：long/short，做多/做空，开多/开空。

  3. 有明确入场方式：具体价格、区间、市价、到价进入、挂单区间之一。

  4. 至少有止损、止盈、无效价、保护价、分批止盈计划之一。

  5. 表达的是新开仓或新挂单，不是已有仓位管理、复盘、教学或广告。


  图片要求：

  - 直接阅读图片中的文字、表格、标注和截图内容。

  - 不要依赖外部 OCR 文本。

  - 不要补全图片或文字里没有出现的价格、币种、方向。

  - 如果图片模糊、裁切、遮挡或关键数字不确定，请判定为“识别失败”或低置信度。


  只输出 JSON，不要输出解释性文字。

  '
