[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-kol-research"
version = "0.1.0"
description = "Local-first Telegram KOL win-rate research toolkit."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "httpx",
    "jinja2",
    "pillow",
    "pyyaml",
    "pytesseract",
    "pytest",
    "sqlalchemy",
    "telethon",
    "typer",
    "tzdata",
    "uvicorn",
    "websockets>=16.0",
]

[project.scripts]
telegram-kol-research = "telegram_kol_research.cli:main"

[tool.pytest.ini_options]
markers = [
  "architecture: static safety boundaries that must pass in normal CI",
]
pythonpath = ["src"]
testpaths = ["tests"]
# tests/archive holds retired acceptance tooling kept only for traceability
# (cleanup step 5); it must not run in the normal suite. Setting this key
# replaces pytest's default patterns, so they are restated verbatim here.
norecursedirs = [
  "*.egg",
  ".*",
  "_darcs",
  "build",
  "CVS",
  "dist",
  "node_modules",
  "venv",
  "{arch}",
  "tests/archive",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
# The provider preset catalogue is data the Web page reads at runtime, so it
# has to travel with the package rather than only with the source tree.
telegram_kol_research = ["ai_provider_presets.json"]

[tool.setuptools.packages.find]
where = ["src"]
