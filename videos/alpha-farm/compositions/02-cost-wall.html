<template id="alpha-farm-cost-wall-template">
  <div
    id="alpha-farm-cost-wall-root"

    data-width="1920"

    <div class="scene-content cost-scene">

            <div class="fee-card"><strong>KOL 02</strong><span>$1,000</span></div>
            <div class="fee-card"><strong>KOL 03</strong><span>$1,000</span></div>
            <div class="fee-card"><strong>KOL 04</strong><span>$1,000</span></div>
            <div class="fee-card"><strong>KOL 05</strong><span>$1,000</span></div>
            <div class="fee-card"><strong>KOL 06</strong><span>$1,000</span></div>
            <div class="fee-card"><strong>KOL 07</strong><span>$1,000</span></div>
            <div class="fee-card"><strong>KOL 08</strong><span>$1,000</span></div>
            <div class="fee-card"><strong>KOL 09</strong><span>$1,000</span></div>
            <div class="fee-card"><strong>KOL 10</strong><span>$1,000</span></div>
            <div class="fee-card"><strong>KOL 11</strong><span>$1,000</span></div>
            <div class="fee-card"><strong>KOL 12</strong><span>$1,000</span></div>

        <section class="cost-equation" aria-label="费用累加公式">
          <div class="equation-step data-text">$1,000 / 6个月</div>
          <div class="equation-operator data-text">× 12 KOL</div>
          <div class="equation-rule"></div>
          <div class="equation-total data-text">$12,000</div>
          <div class="equation-caption">12 个群正常门槛 / 半年</div>

        <section class="aggregation panel" aria-label="低成本信息聚合渠道">

            <span></span>
            <span></span>
            <span></span>
            <strong>Σ</strong>

            <span class="status-dot"></span>
            <span>信息搬运工：通路已建立</span>

          <div class="destination data-text">
            <span>10+ INPUTS</span>
            <span>→</span>
            <strong>ALPHA FARM</strong>

        z-index: 2;
        display: flex;
        align-items: stretch;
        flex: 1;

        flex-direction: column;

        gap: 22px;
      }

        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.1em;

        display: grid;

        align-items: center;
        justify-content: center;
        width: 132px;
        height: 132px;

        border-radius: 50%;
        background: var(--canvas);
        box-shadow: 0 0 44px rgba(139, 92, 246, 0.36);
      }

      #alpha-farm-cost-wall-root .aggregation-icon span {

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};

      var alphaFarmCostWallTimeline = gsap.timeline({ paused: true });

      alphaFarmCostWallTimeline.addLabel("build", 0.2);
      alphaFarmCostWallTimeline.from(
        "#alpha-farm-cost-wall-root .decorative-grid",

        "build",
      );
      alphaFarmCostWallTimeline.from(
        "#alpha-farm-cost-wall-root .scene-kicker",
        { x: -46, opacity: 0, duration: 0.58, ease: "expo.out" },
        "build+=0.03",
      );
      alphaFarmCostWallTimeline.from(
        "#alpha-farm-cost-wall-root .scene-title",
        { y: 42, opacity: 0, duration: 0.72, ease: "power4.out" },
        "build+=0.22",
      );
      alphaFarmCostWallTimeline.from(
        "#alpha-farm-cost-wall-root .cost-period",
        { scale: 0.8, opacity: 0, duration: 0.42, ease: "back.out(1.5)" },
        "build+=0.6",
      );
      alphaFarmCostWallTimeline.from(
        "#alpha-farm-cost-wall-root .fee-wall",
        { x: -54, opacity: 0, duration: 0.68, ease: "circ.out" },
        "build+=0.72",
      );
      alphaFarmCostWallTimeline.from(
        "#alpha-farm-cost-wall-root .fee-wall-header",
        { y: -18, opacity: 0, duration: 0.36, ease: "power2.out" },
        "build+=1.08",
      );
      alphaFarmCostWallTimeline.from(
        "#alpha-farm-cost-wall-root .fee-card:first-child",
        { scale: 0.72, opacity: 0, duration: 0.62, ease: "back.out(1.35)" },
        "build+=1.2",
      );
      alphaFarmCostWallTimeline.from(
        "#alpha-farm-cost-wall-root .fee-card:not(:first-child)",
        {
          x: -24,
          opacity: 0,
          duration: 0.3,
          ease: "power3.out",
          stagger: { amount: 0.44, from: "start" },
        },
        "build+=1.7",
      );
      alphaFarmCostWallTimeline.from(
        "#alpha-farm-cost-wall-root .equation-step",
        { y: 28, opacity: 0, duration: 0.48, ease: "circ.out" },
        3.15,

      alphaFarmCostWallTimeline.from(
        "#alpha-farm-cost-wall-root .equation-operator",

      alphaFarmCostWallTimeline.from(

      alphaFarmCostWallTimeline.from(
        "#alpha-farm-cost-wall-root .equation-caption",
        { opacity: 0, duration: 0.4, ease: "sine.out" },
        5.85,
      );

      alphaFarmCostWallTimeline.addLabel("breathe", 6.65);
      alphaFarmCostWallTimeline.from(
        "#alpha-farm-cost-wall-root .aggregation",
        { x: 62, opacity: 0, duration: 0.78, ease: "expo.out" },

      );
      alphaFarmCostWallTimeline.from(
        "#alpha-farm-cost-wall-root .aggregation-badge",
        { y: -20, opacity: 0, duration: 0.34, ease: "power3.out" },
        "breathe+=0.35",
      );
      alphaFarmCostWallTimeline.from(
        "#alpha-farm-cost-wall-root .aggregation-icon",
        { scale: 0.58, opacity: 0, duration: 0.64, ease: "back.out(1.55)" },
        "breathe+=0.58",
      );
      alphaFarmCostWallTimeline.from(
        "#alpha-farm-cost-wall-root .aggregation h2",
        { y: 24, opacity: 0, duration: 0.46, ease: "circ.out" },
        "breathe+=0.92",
      );
      alphaFarmCostWallTimeline.from(
        "#alpha-farm-cost-wall-root .aggregation p",
        { opacity: 0, duration: 0.62, ease: "sine.out" },
        "breathe+=1.22",
      );
      alphaFarmCostWallTimeline.from(
        "#alpha-farm-cost-wall-root .worker-note",
        { x: 34, opacity: 0, duration: 0.38, ease: "power2.out" },
        "breathe+=1.62",

      alphaFarmCostWallTimeline.to(

          rotation: 360,
          duration: 3.4,
          ease: "sine.inOut",
          repeat: 1,
          yoyo: true,

      );

      alphaFarmCostWallTimeline.addLabel("resolve", 13.25);
      alphaFarmCostWallTimeline.from(
        "#alpha-farm-cost-wall-root .destination",

        "#alpha-farm-cost-wall-root .cost-disclaimer",
        { y: 22, opacity: 0, duration: 0.58, ease: "power3.out" },
        "resolve+=0.42",

      window.__timelines["alpha-farm-cost-wall"] = alphaFarmCostWallTimeline;
    </script>
