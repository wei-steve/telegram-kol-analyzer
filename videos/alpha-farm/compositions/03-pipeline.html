<template id="alpha-farm-pipeline-template">
  <div
    id="alpha-farm-pipeline-root"
    data-composition-id="alpha-farm-pipeline"
    data-width="1920"
    data-height="1080"
  >
    <div class="scene-content pipeline-scene">
      <div class="decorative-grid" data-layout-ignore></div>
      <div class="decorative-glow pipeline-glow" data-layout-ignore></div>

      <header class="pipeline-heading">
        <p class="scene-kicker">FROM LANGUAGE TO CONTROLLED EXECUTION</p>
        <h1 class="scene-title">不是复制，是理解 + 约束 + 执行</h1>
        <p class="scene-subtitle">
          一条自然语言策略，必须经过可检查、可计算、可拒绝的系统流水线。
        </p>
      </header>

      <main class="pipeline-flow" aria-label="Telegram 策略进入 AI 自动交易流水线">
        <article class="pipeline-node telegram-node">
          <div class="node-index data-text">01</div>
          <div class="node-icon">T</div>
          <div class="node-copy">
            <p class="node-type data-text">SOURCE</p>
            <h2>Telegram</h2>
            <p>原始策略消息</p>
          </div>
          <span class="node-status data-text">RECEIVED</span>
        </article>

        <div class="pipeline-link">
          <span></span>
          <strong>→</strong>
        </div>

        <article class="pipeline-node ai-node">
          <div class="node-index data-text">02</div>
          <div class="node-icon">AI</div>
          <div class="node-copy">
            <p class="node-type data-text">REASON</p>
            <h2>AI 理解</h2>
            <p>提取交易字段</p>
          </div>
          <span class="node-status data-text">PARSED</span>
        </article>

        <div class="pipeline-link">
          <span></span>
          <strong>→</strong>
        </div>

        <article class="pipeline-node risk-node is-active">
          <div class="node-index data-text">03</div>
          <div class="node-icon">R</div>
          <div class="node-copy">
            <p class="node-type data-text">CONTROL</p>
            <h2>规则过滤 / 风控计算</h2>
            <p>检查止损，反推仓位</p>
          </div>
          <span class="node-status data-text">VERIFYING</span>
        </article>

        <div class="pipeline-link pending-link">
          <span></span>
          <strong>→</strong>
        </div>

        <article class="pipeline-node execution-node">
          <div class="node-index data-text">04</div>
          <div class="node-icon">D</div>
          <div class="node-copy">
            <p class="node-type data-text">EXECUTE</p>
            <h2>Deepcoin 执行</h2>
            <p>生成受控订单</p>
          </div>
          <span class="node-status data-text">READY</span>
        </article>

        <div class="pipeline-link pending-link">
          <span></span>
          <strong>→</strong>
        </div>

        <article class="pipeline-node protect-node">
          <div class="node-index data-text">05</div>
          <div class="node-icon">✓</div>
          <div class="node-copy">
            <p class="node-type data-text">PROTECT</p>
            <h2>持仓保护</h2>
            <p>止损与后续管理</p>
          </div>
          <span class="node-status data-text">ARMED</span>
        </article>
      </main>

      <section class="pipeline-message panel">
        <div class="message-source data-text">
          <span>RAW MESSAGE</span>
          <strong>BTC SHORT · 71000–71800 · SL 72300</strong>
        </div>
        <div class="message-position">
          <span class="position-dot"></span>
          <span>当前消息：风控计算</span>
        </div>
        <div class="message-policy data-text">NO STOP → NO TRADE</div>
      </section>
    </div>

    <style>
      #alpha-farm-pipeline-root .pipeline-scene {
        padding-bottom: 180px;
        gap: 42px;
      }

      #alpha-farm-pipeline-root .pipeline-glow {
        top: 320px;
        left: 690px;
        width: 540px;
        height: 540px;
        background: rgba(139, 92, 246, 0.2);
      }

      #alpha-farm-pipeline-root .pipeline-heading {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      #alpha-farm-pipeline-root .pipeline-heading .scene-title {
        max-width: 1350px;
        font-size: 68px;
      }

      #alpha-farm-pipeline-root .pipeline-heading .scene-subtitle {
        font-size: 24px;
      }

      #alpha-farm-pipeline-root .pipeline-flow {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        flex: 1;
        min-height: 0;
      }

      #alpha-farm-pipeline-root .pipeline-node {
        position: relative;
        display: flex;
        flex: 1;
        align-items: center;
        justify-content: flex-start;
        flex-direction: column;
        align-self: stretch;
        min-width: 0;
        padding: 30px 20px 24px;
        gap: 18px;
        border: 1px solid rgba(53, 194, 255, 0.28);
        border-radius: 20px;
        background: rgba(7, 10, 18, 0.86);
        box-shadow: inset 0 0 36px rgba(53, 194, 255, 0.04);
        text-align: center;
      }

      #alpha-farm-pipeline-root .pipeline-node.is-active {
        flex: 1.35;
        border: 2px solid var(--ai-violet);
        background: rgba(139, 92, 246, 0.1);
        box-shadow:
          inset 0 0 44px rgba(139, 92, 246, 0.08),
          0 0 45px rgba(139, 92, 246, 0.22);
      }

      #alpha-farm-pipeline-root .node-index {
        align-self: flex-start;
        color: var(--electric-blue);
        font-size: 15px;
        font-weight: 700;
      }

      #alpha-farm-pipeline-root .node-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 82px;
        height: 82px;
        border: 2px solid var(--electric-blue);
        border-radius: 20px;
        color: var(--primary-text);
        background: rgba(53, 194, 255, 0.08);
        font-family: var(--font-data);
        font-size: 35px;
        font-weight: 900;
        box-shadow: 0 0 26px rgba(53, 194, 255, 0.18);
      }

      #alpha-farm-pipeline-root .ai-node .node-icon,
      #alpha-farm-pipeline-root .risk-node .node-icon {
        border-color: var(--ai-violet);
        background: rgba(139, 92, 246, 0.1);
        box-shadow: 0 0 28px rgba(139, 92, 246, 0.3);
      }

      #alpha-farm-pipeline-root .protect-node .node-icon {
        border-color: var(--safety-green);
        color: var(--safety-green);
        background: rgba(47, 230, 166, 0.08);
      }

      #alpha-farm-pipeline-root .node-copy {
        display: flex;
        align-items: center;
        flex-direction: column;
        gap: 8px;
      }

      #alpha-farm-pipeline-root .node-type {
        color: var(--electric-blue);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.13em;
      }

      #alpha-farm-pipeline-root .node-copy h2 {
        color: var(--primary-text);
        font-size: 25px;
        font-weight: 900;
        line-height: 1.3;
      }

      #alpha-farm-pipeline-root .risk-node .node-copy h2 {
        font-size: 26px;
      }

      #alpha-farm-pipeline-root .node-copy > p:last-child {
        color: var(--primary-text);
        font-size: 18px;
        line-height: 1.45;
      }

      #alpha-farm-pipeline-root .node-status {
        margin-top: auto;
        padding: 8px 11px;
        border-radius: 6px;
        color: var(--safety-green);
        background: rgba(47, 230, 166, 0.08);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      #alpha-farm-pipeline-root .risk-node .node-status {
        color: #a784f8;
        background: rgba(139, 92, 246, 0.12);
      }

      #alpha-farm-pipeline-root .pipeline-link {
        display: flex;
        flex: 0 0 62px;
        align-items: center;
        justify-content: center;
      }

      #alpha-farm-pipeline-root .pipeline-link span {
        width: 30px;
        height: 2px;
        background: var(--safety-green);
        box-shadow: 0 0 10px rgba(47, 230, 166, 0.5);
      }

      #alpha-farm-pipeline-root .pipeline-link strong {
        color: var(--safety-green);
        font-size: 23px;
      }

      #alpha-farm-pipeline-root .pipeline-link.pending-link span {
        background: var(--electric-blue);
        box-shadow: none;
        opacity: 0.45;
      }

      #alpha-farm-pipeline-root .pipeline-link.pending-link strong {
        color: var(--electric-blue);
        opacity: 0.65;
      }

      #alpha-farm-pipeline-root .pipeline-message {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 94px;
        padding: 18px 24px;
        gap: 28px;
      }

      #alpha-farm-pipeline-root .message-source {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      #alpha-farm-pipeline-root .message-source span {
        color: var(--electric-blue);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
      }

      #alpha-farm-pipeline-root .message-source strong {
        color: var(--primary-text);
        font-size: 20px;
      }

      #alpha-farm-pipeline-root .message-position {
        display: flex;
        align-items: center;
        gap: 11px;
        color: var(--primary-text);
        font-size: 19px;
        font-weight: 700;
      }

      #alpha-farm-pipeline-root .position-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--ai-violet);
        box-shadow: 0 0 18px rgba(139, 92, 246, 0.85);
      }

      #alpha-farm-pipeline-root .message-policy {
        padding: 10px 14px;
        border: 1px solid rgba(255, 77, 103, 0.45);
        border-radius: 8px;
        color: var(--risk-red);
        background: rgba(255, 77, 103, 0.07);
        font-size: 16px;
        font-weight: 800;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};

      var alphaFarmPipelineTimeline = gsap.timeline({ paused: true });

      alphaFarmPipelineTimeline.addLabel("build", 0.2);
      alphaFarmPipelineTimeline.from(
        "#alpha-farm-pipeline-root .decorative-grid",
        { opacity: 0, duration: 1.15, ease: "sine.out" },
        "build",
      );
      alphaFarmPipelineTimeline.from(
        "#alpha-farm-pipeline-root .scene-kicker",
        { x: -48, opacity: 0, duration: 0.55, ease: "expo.out" },
        "build+=0.02",
      );
      alphaFarmPipelineTimeline.from(
        "#alpha-farm-pipeline-root .scene-title",
        { y: 38, opacity: 0, duration: 0.7, ease: "power4.out" },
        "build+=0.2",
      );
      alphaFarmPipelineTimeline.from(
        "#alpha-farm-pipeline-root .scene-subtitle",
        { x: 30, opacity: 0, duration: 0.48, ease: "circ.out" },
        "build+=0.7",
      );
      alphaFarmPipelineTimeline.from(
        "#alpha-farm-pipeline-root .pipeline-message",
        { y: 36, opacity: 0, duration: 0.62, ease: "power3.out" },
        1.28,
      );
      alphaFarmPipelineTimeline.from(
        "#alpha-farm-pipeline-root .message-source",
        { x: -28, opacity: 0, duration: 0.4, ease: "expo.out" },
        1.58,
      );

      alphaFarmPipelineTimeline.from(
        "#alpha-farm-pipeline-root .telegram-node",
        { x: -62, opacity: 0, duration: 0.58, ease: "power4.out" },
        1.75,
      );
      alphaFarmPipelineTimeline.from(
        "#alpha-farm-pipeline-root .pipeline-link:nth-of-type(1)",
        { scaleX: 0, opacity: 0, transformOrigin: "left center", duration: 0.3, ease: "expo.out" },
        2.32,
      );
      alphaFarmPipelineTimeline.from(
        "#alpha-farm-pipeline-root .ai-node",
        { scale: 0.74, opacity: 0, duration: 0.54, ease: "back.out(1.45)" },
        2.62,
      );
      alphaFarmPipelineTimeline.from(
        "#alpha-farm-pipeline-root .pipeline-link:nth-of-type(2)",
        { scaleX: 0, opacity: 0, transformOrigin: "left center", duration: 0.32, ease: "circ.out" },
        3.16,
      );
      alphaFarmPipelineTimeline.from(
        "#alpha-farm-pipeline-root .risk-node",
        { y: 48, opacity: 0, duration: 0.66, ease: "expo.out" },
        3.48,
      );
      alphaFarmPipelineTimeline.from(
        "#alpha-farm-pipeline-root .message-position",
        { scale: 0.8, opacity: 0, duration: 0.38, ease: "back.out(1.6)" },
        4.02,
      );
      alphaFarmPipelineTimeline.from(
        "#alpha-farm-pipeline-root .pipeline-link:nth-of-type(3)",
        { scaleX: 0, opacity: 0, transformOrigin: "left center", duration: 0.3, ease: "power3.out" },
        4.36,
      );
      alphaFarmPipelineTimeline.from(
        "#alpha-farm-pipeline-root .execution-node",
        { y: -42, opacity: 0, duration: 0.56, ease: "circ.out" },
        4.66,
      );
      alphaFarmPipelineTimeline.from(
        "#alpha-farm-pipeline-root .pipeline-link:nth-of-type(4)",
        { scaleX: 0, opacity: 0, transformOrigin: "left center", duration: 0.34, ease: "expo.out" },
        5.2,
      );
      alphaFarmPipelineTimeline.from(
        "#alpha-farm-pipeline-root .protect-node",
        { x: 54, opacity: 0, duration: 0.62, ease: "power4.out" },
        5.5,
      );

      alphaFarmPipelineTimeline.addLabel("breathe", 6.55);
      alphaFarmPipelineTimeline.to(
        "#alpha-farm-pipeline-root .position-dot",
        {
          scale: 1.65,
          duration: 1.05,
          ease: "sine.inOut",
          repeat: 2,
          yoyo: true,
        },
        "breathe",
      );

      alphaFarmPipelineTimeline.addLabel("resolve", 10.15);
      alphaFarmPipelineTimeline.from(
        "#alpha-farm-pipeline-root .message-policy",
        { scale: 0.72, opacity: 0, duration: 0.46, ease: "back.out(1.65)" },
        "resolve",
      );

      window.__timelines["alpha-farm-pipeline"] = alphaFarmPipelineTimeline;
    </script>
  </div>
</template>
