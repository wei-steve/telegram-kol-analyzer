    <style>
      @font-face {
        font-family: "PingFang SC";
        src: local("PingFang SC");
      }

      @font-face {
        font-family: "Source Han Sans SC";
        src: local("Source Han Sans SC");
      }

      #scene-kol-roster {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        color: #f4f7ff;
        background-color: #070a12;
        font-family: "PingFang SC", "Source Han Sans SC", sans-serif;
      }

      #scene-kol-roster * {
        box-sizing: border-box;
      }

      #scene-kol-roster .scene-content {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        padding: 58px 112px 180px;
        gap: 24px;
        background:
          radial-gradient(circle at 86% 12%, rgba(139, 92, 246, 0.13), transparent 28%),
          linear-gradient(rgba(53, 194, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(53, 194, 255, 0.035) 1px, transparent 1px);
        background-size: auto, 64px 64px, 64px 64px;
      }

      #scene-kol-roster .scene-header,
      #scene-kol-roster .roster-footer {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
      }

      #scene-kol-roster .eyebrow {
        margin: 0 0 10px;
        color: #35c2ff;
        font: 700 18px/1.2 "Space Grotesk", sans-serif;
        letter-spacing: 0.18em;
      }

      #scene-kol-roster h1 {
        margin: 0;
        font-size: 68px;
        line-height: 1.12;
        letter-spacing: -0.04em;
      }

      #scene-kol-roster .signal-note {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 20px;
        color: #2fe6a6;
        border: 1px solid rgba(47, 230, 166, 0.34);
        border-radius: 999px;
        background: rgba(47, 230, 166, 0.07);
        font-size: 20px;
      }

      #scene-kol-roster .signal-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #2fe6a6;
        box-shadow: 0 0 18px rgba(47, 230, 166, 0.8);
      }

      #scene-kol-roster .featured-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        flex: 1;
        gap: 22px;
        min-height: 0;
      }

      #scene-kol-roster .kol-card {
        display: flex;
        flex-direction: column;
        min-width: 0;
        padding: 24px;
        gap: 20px;
        border: 1px solid rgba(244, 247, 255, 0.12);
        border-radius: 24px;
        background: rgba(14, 20, 35, 0.9);
        box-shadow: 0 22px 58px rgba(0, 0, 0, 0.24);
      }

      #scene-kol-roster .kol-card-blue { border-top-color: #35c2ff; }
      #scene-kol-roster .kol-card-violet { border-top-color: #8b5cf6; }
      #scene-kol-roster .kol-card-green { border-top-color: #2fe6a6; }
      #scene-kol-roster .kol-card-red { border-top-color: #ff4d67; }

      #scene-kol-roster .kol-identity {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      #scene-kol-roster .avatar {
        position: relative;
        display: grid;
        place-items: center;
        flex: 0 0 74px;
        width: 74px;
        height: 74px;
        overflow: hidden;
        color: #f4f7ff;
        border: 1px solid rgba(53, 194, 255, 0.42);
        border-radius: 20px;
        background: linear-gradient(145deg, rgba(53, 194, 255, 0.24), rgba(139, 92, 246, 0.2));
        font-size: 30px;
        font-weight: 700;
      }

      #scene-kol-roster .avatar img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      #scene-kol-roster h2 {
        margin: 0 0 6px;
        font-size: 27px;
        line-height: 1.15;
      }

      #scene-kol-roster .kol-identity p {
        margin: 0;
        color: rgba(244, 247, 255, 0.58);
        font-size: 17px;
      }

      #scene-kol-roster .message-card {
        position: relative;
        flex: 1;
        min-height: 0;
        overflow: hidden;
        border: 1px solid rgba(53, 194, 255, 0.13);
        border-radius: 18px;
        background: #0a1020;
      }

      #scene-kol-roster .message-card > img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #0a1020;
      }

      #scene-kol-roster .message-fallback {
        display: flex;
        flex-direction: column;
        justify-content: center;
        height: 100%;
        padding: 22px;
        gap: 13px;
        font-family: "JetBrains Mono", monospace;
        font-size: 17px;
        font-variant-numeric: tabular-nums;
      }

      #scene-kol-roster .message-fallback strong {
        color: #35c2ff;
        font-size: 19px;
      }

      #scene-kol-roster .roster-footer {
        min-height: 68px;
      }

      #scene-kol-roster .mini-roster {
        display: flex;
      }

      #scene-kol-roster .mini-roster span {
        display: grid;
        place-items: center;
        width: 46px;
        height: 46px;
        margin-right: -9px;
        color: rgba(244, 247, 255, 0.78);
        border: 2px solid #070a12;
        border-radius: 50%;
        background: #172039;
        font-size: 17px;
      }

      #scene-kol-roster .isolation-note {
        display: flex;
        align-items: center;
        padding: 12px 20px;
        gap: 14px;
        border: 1px solid rgba(47, 230, 166, 0.34);
        border-radius: 16px;
        background: rgba(47, 230, 166, 0.07);
      }

      #scene-kol-roster .isolation-note strong {
        color: #2fe6a6;
        font-size: 19px;
        font-weight: 800;
      }

      #scene-kol-roster .isolation-note span {
        color: rgba(244, 247, 255, 0.82);
        font-size: 18px;
      }

      #scene-kol-roster .roster-footer small {
        color: rgba(244, 247, 255, 0.5);
        font-size: 16px;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const kolRosterTimeline = gsap.timeline({ paused: true });

      kolRosterTimeline.addLabel("roster-build", 0.2);
      kolRosterTimeline.from("#scene-kol-roster .eyebrow", { x: -34, opacity: 0, duration: 0.42, ease: "expo.out" }, "roster-build");
      kolRosterTimeline.from("#scene-kol-roster h1", { y: 38, opacity: 0, duration: 0.72, ease: "power4.out" }, "roster-build+=0.16");
      kolRosterTimeline.from("#scene-kol-roster .signal-note", { x: 42, opacity: 0, duration: 0.54, ease: "circ.out" }, "roster-build+=0.34");
      kolRosterTimeline.from(
        "#scene-kol-roster .kol-card",
        { y: 54, opacity: 0, scale: 0.97, duration: 0.68, stagger: 0.12, ease: "back.out(1.22)" },
        "roster-build+=0.78",
      );
      kolRosterTimeline.from(
        "#scene-kol-roster .kol-identity",
        { x: -24, opacity: 0, duration: 0.38, stagger: 0.1, ease: "power3.out" },
        "roster-build+=1.18",
      );
      kolRosterTimeline.from(
        "#scene-kol-roster .message-card",
        { y: 28, opacity: 0, scale: 0.985, duration: 0.56, stagger: 0.11, ease: "expo.out" },
        "roster-build+=1.66",
      );
      kolRosterTimeline.from(
        "#scene-kol-roster .mini-roster span",
        {
          scale: 0.5,
          opacity: 0,
          rotation: -8,
          duration: 0.34,
          stagger: 0.055,
          transformOrigin: "50% 50%",
          ease: "back.out(1.8)",
        },
        "roster-build+=2.7",
      );
      kolRosterTimeline.from("#scene-kol-roster .isolation-note", { y: 22, opacity: 0, duration: 0.46, ease: "power2.out" }, "roster-build+=3");
      kolRosterTimeline.from("#scene-kol-roster .roster-footer small", { opacity: 0, duration: 0.82, ease: "sine.out" }, "roster-build+=3.22");
      kolRosterTimeline.from(
        "#scene-kol-roster .signal-dot",
        {
          scale: 0.45,
          opacity: 0.35,
          duration: 0.7,
          repeat: 2,
          yoyo: true,
          transformOrigin: "50% 50%",
          ease: "sine.inOut",
        },
        4.2,
      );

      window.__timelines["alpha-farm-kol-roster"] = kolRosterTimeline;
    </script>
  </div>
</template>
