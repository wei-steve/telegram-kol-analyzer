<template id="alpha-farm-opening-template">
  <div
    id="alpha-farm-opening-root"
    data-composition-id="alpha-farm-opening"
    data-width="1920"
    data-height="1080"
  >
    <div class="scene-content opening-scene">
      <div class="decorative-grid" data-layout-ignore></div>
      <div class="decorative-glow opening-glow-blue" data-layout-ignore></div>
      <div class="decorative-glow opening-glow-violet" data-layout-ignore></div>

      <header class="opening-header">
        <div class="scene-kicker">AI-NATIVE TRADING CONTROL ROOM</div>
        <div class="status-pill">
          <span class="status-dot"></span>
          10+ KOL ONLINE
        </div>
      </header>

      <main class="opening-hero">
        <section class="opening-copy">
          <p class="opening-hook">我没有雇交易员</p>
          <h1 class="opening-title">Alpha 牧场</h1>
          <p class="opening-subtitle">让 KOL 提供 Alpha，让 AI 负责执行</p>
          <div class="opening-route data-text">
            <span>TELEGRAM SIGNALS</span>
            <span class="route-arrow">→</span>
            <span>AI PIPELINE</span>
          </div>
        </section>

        <section class="kol-network panel" aria-label="十几个 KOL 汇入 AI 中枢">
          <div class="avatar-grid">
            <div class="avatar-node"><span>大镖客</span><small>BTC</small></div>
            <div class="avatar-node"><span>飞扬</span><small>BTC</small></div>
            <div class="avatar-node"><span>峰哥</span><small>ETH</small></div>
            <div class="avatar-node"><span>智哥</span><small>ORDER</small></div>
            <div class="avatar-node"><span>K05</span><small>ONLINE</small></div>
            <div class="avatar-node"><span>K06</span><small>ONLINE</small></div>
            <div class="avatar-node"><span>K07</span><small>ONLINE</small></div>
            <div class="avatar-node"><span>K08</span><small>ONLINE</small></div>
            <div class="avatar-node"><span>K09</span><small>ONLINE</small></div>
            <div class="avatar-node"><span>K10</span><small>ONLINE</small></div>
            <div class="avatar-node"><span>K11</span><small>ONLINE</small></div>
            <div class="avatar-node"><span>K12</span><small>ONLINE</small></div>
          </div>

          <div class="ai-core">
            <span class="core-orbit"></span>
            <span class="core-label data-text">AI</span>
            <small>REASONING CORE</small>
          </div>

          <div class="message-stack" aria-label="策略消息流">
            <div class="message-chip data-text">BTC / SHORT / SL ✓</div>
            <div class="message-chip data-text">ETH / ENTRY / TP ✓</div>
            <div class="message-chip data-text">ORDER UPDATE / ✓</div>
          </div>
        </section>
      </main>

      <footer class="opening-footer data-text">
        <span>INFORMATION</span>
        <span>→</span>
        <span>DISCIPLINE</span>
        <span>→</span>
        <span>EXECUTION</span>
      </footer>
    </div>

    <style>
      #alpha-farm-opening-root .opening-scene {
        justify-content: space-between;
      }

      #alpha-farm-opening-root .opening-glow-blue {
        top: 80px;
        right: 60px;
        width: 520px;
        height: 520px;
        background: rgba(53, 194, 255, 0.2);
      }

      #alpha-farm-opening-root .opening-glow-violet {
        right: 530px;
        bottom: -160px;
        width: 500px;
        height: 500px;
        background: rgba(139, 92, 246, 0.18);
      }

      #alpha-farm-opening-root .opening-header,
      #alpha-farm-opening-root .opening-footer {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      #alpha-farm-opening-root .opening-hero {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        flex: 1;
        gap: 72px;
        min-height: 0;
      }

      #alpha-farm-opening-root .opening-copy {
        display: flex;
        flex: 0 0 650px;
        flex-direction: column;
        gap: 22px;
      }

      #alpha-farm-opening-root .opening-hook {
        color: var(--electric-blue);
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      #alpha-farm-opening-root .opening-title {
        color: var(--primary-text);
        font-size: 126px;
        font-weight: 900;
        letter-spacing: -0.055em;
        line-height: 0.98;
        text-shadow:
          5px 0 0 rgba(53, 194, 255, 0.14),
          -5px 0 0 rgba(139, 92, 246, 0.15);
      }

      #alpha-farm-opening-root .opening-subtitle {
        max-width: 610px;
        color: var(--primary-text);
        font-size: 33px;
        font-weight: 350;
        line-height: 1.5;
      }

      #alpha-farm-opening-root .opening-route {
        display: flex;
        align-items: center;
        width: max-content;
        margin-top: 18px;
        padding: 14px 18px;
        gap: 15px;
        border-left: 3px solid var(--ai-violet);
        color: var(--primary-text);
        background: rgba(139, 92, 246, 0.08);
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      #alpha-farm-opening-root .route-arrow {
        color: var(--ai-violet);
        font-size: 24px;
      }

      #alpha-farm-opening-root .kol-network {
        position: relative;
        display: flex;
        flex: 1;
        align-items: center;
        justify-content: center;
        align-self: stretch;
        min-width: 0;
        min-height: 590px;
        padding: 42px;
        overflow: hidden;
      }

      #alpha-farm-opening-root .avatar-grid {
        display: grid;
        width: 100%;
        height: 100%;
        grid-template-columns: repeat(6, 1fr);
        grid-template-rows: repeat(2, 1fr);
        column-gap: 14px;
        row-gap: 220px;
      }

      #alpha-farm-opening-root .avatar-node {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 6px;
        min-height: 0;
        border: 1px solid rgba(53, 194, 255, 0.36);
        border-radius: 18px;
        color: var(--primary-text);
        background: rgba(7, 10, 18, 0.82);
        box-shadow: inset 0 0 22px rgba(53, 194, 255, 0.05);
        font-size: 22px;
        font-weight: 700;
      }

      #alpha-farm-opening-root .avatar-node small {
        color: var(--electric-blue);
        font-family: var(--font-data);
        font-size: 13px;
        letter-spacing: 0.08em;
      }

      #alpha-farm-opening-root .avatar-node:nth-child(3),
      #alpha-farm-opening-root .avatar-node:nth-child(4),
      #alpha-farm-opening-root .avatar-node:nth-child(9),
      #alpha-farm-opening-root .avatar-node:nth-child(10) {
        border-color: rgba(139, 92, 246, 0.62);
      }

      #alpha-farm-opening-root .ai-core {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        width: 196px;
        height: 196px;
        gap: 8px;
        border: 2px solid var(--ai-violet);
        border-radius: 50%;
        color: var(--primary-text);
        background: var(--canvas);
        box-shadow:
          0 0 0 18px rgba(139, 92, 246, 0.08),
          0 0 72px rgba(139, 92, 246, 0.42);
      }

      #alpha-farm-opening-root .core-orbit {
        position: absolute;
        inset: 18px;
        border: 1px solid rgba(53, 194, 255, 0.5);
        border-radius: 50%;
      }

      #alpha-farm-opening-root .core-label {
        color: var(--primary-text);
        font-size: 74px;
        font-weight: 900;
        letter-spacing: -0.08em;
        line-height: 1;
      }

      #alpha-farm-opening-root .ai-core small {
        color: var(--ai-violet);
        font-family: var(--font-data);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
      }

      #alpha-farm-opening-root .message-stack {
        position: absolute;
        right: 34px;
        top: 50%;
        display: flex;
        align-items: flex-end;
        flex-direction: column;
        gap: 8px;
        transform: translateY(-50%);
      }

      #alpha-farm-opening-root .message-chip {
        padding: 8px 12px;
        border: 1px solid rgba(47, 230, 166, 0.3);
        border-radius: 8px;
        color: var(--safety-green);
        background: var(--canvas);
        font-size: 12px;
      }

      #alpha-farm-opening-root .opening-footer {
        justify-content: flex-start;
        gap: 22px;
        color: var(--primary-text);
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.16em;
      }

      #alpha-farm-opening-root .opening-footer span:nth-child(even) {
        color: var(--electric-blue);
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};

      var alphaFarmOpeningTimeline = gsap.timeline({ paused: true });

      alphaFarmOpeningTimeline.addLabel("build", 0.2);
      alphaFarmOpeningTimeline.from(
        "#alpha-farm-opening-root .decorative-grid",
        { opacity: 0, duration: 1.25, ease: "sine.out" },
        "build",
      );
      alphaFarmOpeningTimeline.from(
        "#alpha-farm-opening-root .scene-kicker",
        { x: -52, opacity: 0, duration: 0.62, ease: "expo.out" },
        "build+=0.04",
      );
      alphaFarmOpeningTimeline.from(
        "#alpha-farm-opening-root .status-pill",
        { scale: 0.78, opacity: 0, duration: 0.4, ease: "back.out(1.55)" },
        "build+=0.28",
      );
      alphaFarmOpeningTimeline.from(
        "#alpha-farm-opening-root .kol-network",
        { scale: 0.95, opacity: 0, duration: 0.88, ease: "power4.out" },
        "build+=0.34",
      );
      alphaFarmOpeningTimeline.from(
        "#alpha-farm-opening-root .opening-hook",
        { y: 26, opacity: 0, duration: 0.5, ease: "circ.out" },
        "build+=0.48",
      );
      alphaFarmOpeningTimeline.from(
        "#alpha-farm-opening-root .opening-title",
        { x: -76, opacity: 0, duration: 0.82, ease: "power3.out" },
        "build+=0.7",
      );
      alphaFarmOpeningTimeline.from(
        "#alpha-farm-opening-root .opening-subtitle",
        { y: 34, opacity: 0, duration: 0.62, ease: "power2.out" },
        "build+=1.22",
      );
      alphaFarmOpeningTimeline.from(
        "#alpha-farm-opening-root .opening-route",
        {
          scaleX: 0,
          opacity: 0,
          transformOrigin: "left center",
          duration: 0.48,
          ease: "expo.out",
        },
        "build+=1.72",
      );
      alphaFarmOpeningTimeline.from(
        "#alpha-farm-opening-root .avatar-node",
        {
          scale: 0.72,
          opacity: 0,
          duration: 0.42,
          ease: "back.out(1.35)",
          stagger: { amount: 0.45, from: "edges" },
        },
        "build+=1.12",
      );
      alphaFarmOpeningTimeline.from(
        "#alpha-farm-opening-root .ai-core",
        { scale: 0.54, opacity: 0, duration: 0.72, ease: "expo.out" },
        "build+=1.58",
      );
      alphaFarmOpeningTimeline.from(
        "#alpha-farm-opening-root .core-orbit",
        { rotation: -110, opacity: 0, duration: 0.86, ease: "power4.out" },
        "build+=1.82",
      );
      alphaFarmOpeningTimeline.from(
        "#alpha-farm-opening-root .message-chip",
        {
          x: 38,
          opacity: 0,
          duration: 0.36,
          ease: "circ.out",
          stagger: 0.09,
        },
        "build+=2.3",
      );

      alphaFarmOpeningTimeline.addLabel("breathe", 4.4);
      alphaFarmOpeningTimeline.to(
        "#alpha-farm-opening-root .core-orbit",
        {
          rotation: 180,
          duration: 3,
          ease: "sine.inOut",
          repeat: 1,
          yoyo: true,
        },
        "breathe",
      );

      alphaFarmOpeningTimeline.addLabel("resolve", 10.55);
      alphaFarmOpeningTimeline.from(
        "#alpha-farm-opening-root .opening-footer span",
        {
          y: 20,
          opacity: 0,
          duration: 0.42,
          ease: "power3.out",
          stagger: 0.06,
        },
        "resolve",
      );

      window.__timelines["alpha-farm-opening"] = alphaFarmOpeningTimeline;
    </script>
  </div>
</template>
