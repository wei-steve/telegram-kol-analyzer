<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="stylesheet" href="styles/base.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="180"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="scene-opening"
        data-composition-id="alpha-farm-opening"
        data-composition-src="compositions/01-opening.html"
        data-start="0"
        data-duration="15"
        data-track-index="1"
      ></div>
      <div
        id="scene-cost-wall"
        data-composition-id="alpha-farm-cost-wall"
        data-composition-src="compositions/02-cost-wall.html"
        data-start="15"
        data-duration="18"
        data-track-index="1"
      ></div>
      <div
        id="scene-pipeline"
        data-composition-id="alpha-farm-pipeline"
        data-composition-src="compositions/03-pipeline.html"
        data-start="33"
        data-duration="13"
        data-track-index="1"
      ></div>
      <div
        id="scene-kol-roster"
        data-composition-id="alpha-farm-kol-roster"
        data-composition-src="compositions/04-kol-roster.html"
        data-start="46"
        data-duration="21"
        data-track-index="1"
      ></div>
      <div
        id="scene-ai-parsing"
        data-composition-id="alpha-farm-ai-parsing"
        data-composition-src="compositions/05-ai-parsing.html"
        data-start="67"
        data-duration="18"
        data-track-index="1"
      ></div>
      <div
        id="scene-risk-sizing"
        data-composition-id="alpha-farm-risk-sizing"
        data-composition-src="compositions/06-risk-sizing.html"
        data-start="85"
        data-duration="42"
        data-track-index="1"
      ></div>
      <div
        id="scene-two-leg-entry"
        data-composition-id="scene-07-two-leg-entry"
        data-composition-src="compositions/07-two-leg-entry.html"
        data-start="127"
        data-duration="20"
        data-track-index="1"
      ></div>
      <div
        id="scene-safety-gate"
        data-composition-id="scene-08-safety-gate"
        data-composition-src="compositions/08-safety-gate.html"
        data-start="147"
        data-duration="16"
        data-track-index="1"
      ></div>
      <div
        id="scene-outro"
        data-composition-id="scene-09-outro"
        data-composition-src="compositions/09-outro.html"
        data-start="163"
        data-duration="17"
        data-track-index="1"
      ></div>

      <!-- Track 2 is reserved for captions once narration timing is locked. -->
      <div
        id="captions-track-reserved"
        class="clip"
        data-start="0"
        data-duration="180"
        data-track-index="2"
        aria-hidden="true"
      ></div>
      <audio
        id="narration"
        data-start="0"
        data-duration="180"
        data-track-index="3"
        src="audio/generated/narration-timed.wav"
        data-volume="1"
      ></audio>
      <!-- Track 4 is reserved for background music. -->
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
