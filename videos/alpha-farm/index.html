    <script>

        [70.5, 73.6, "识别币种、方向、入场范围"],

        [176.9, 179.7, "让 KOL 提供 Alpha，让 AI 负责执行"]
      ];

      const CAPTION_WINDOWS = [
        [0.5, 14.62, 0.4, 11.464],
        [15.5, 31.88, 15.4, 29.848],
        [33.5, 45.08, 33.4, 45.28],
        [46.5, 66.16, 46.4, 65.288],
        [67.5, 84.18, 67.4, 84.32],
        [85.5, 126.18, 85.4, 125.072],
        [127.5, 146.44, 127.4, 146.456],
        [147.5, 162.79, 147.4, 160.456],
        [163.3, 179.7, 163.4, 179.192]
      ];

      function retimeCaption(cue) {
        const window = CAPTION_WINDOWS.find(function (item) {
          return cue[0] >= item[0] && cue[0] <= item[1];
        });
        if (!window) return cue;
        const scale = (window[3] - window[2]) / (window[1] - window[0]);
        return [
          window[2] + (cue[0] - window[0]) * scale,
          window[2] + (cue[1] - window[0]) * scale,
          cue[2]
        ];
      }

      const captionLayer = document.getElementById("caption-layer");
      CAPTIONS.map(retimeCaption).forEach(function (cue, index) {
        const el = document.createElement("div");
        el.id = "caption-" + index;
        el.className = "caption-cue";
        el.textContent = cue[2];
        captionLayer.appendChild(el);

        tl.set(el, { visibility: "visible" }, cue[0]);
        tl.fromTo(
          el,
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.24, ease: "power3.out" },
          cue[0]
        );
        tl.to(
          el,
          { opacity: 0, scale: 0.98, duration: 0.12, ease: "power2.in" },
          cue[1] - 0.12
        );
        tl.set(el, { opacity: 0, visibility: "hidden" }, cue[1]);
      });

      function addDataPush(time, colorA, colorB) {
        tl.set("#transition-wipe-a", { x: -1920, backgroundColor: colorA }, time - 0.3);
        tl.set("#transition-wipe-b", { x: -1920, backgroundColor: colorB }, time - 0.3);
        tl.to("#transition-wipe-a", { x: 0, duration: 0.28, ease: "power3.inOut" }, time - 0.28);
        tl.to("#transition-wipe-b", { x: 0, duration: 0.28, ease: "power3.inOut" }, time - 0.21);
        tl.to("#transition-wipe-a", { x: 1920, duration: 0.28, ease: "power3.inOut" }, time + 0.07);
        tl.to("#transition-wipe-b", { x: 1920, duration: 0.28, ease: "power3.inOut" }, time + 0.14);
      }

      addDataPush(15, "#35c2ff", "#111a36");
      addDataPush(33, "#35c2ff", "#111a36");
      addDataPush(46, "#35c2ff", "#111a36");
      addDataPush(67, "#35c2ff", "#111a36");
      addDataPush(85, "#8b5cf6", "#261d4a");
      addDataPush(127, "#35c2ff", "#111a36");
      addDataPush(147, "#ff4d67", "#35131d");
      addDataPush(163, "#8b5cf6", "#070a12");

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
