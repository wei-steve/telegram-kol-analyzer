{% set workbench_destinations = [
  ('home', '首页'),
  ('positions', '持仓'),
  ('strategies', '策略'),
  ('messages', '消息'),
  ('management-batches', '批次'),
  ('more', '更多')
] %}
<nav class="desktop-workbench-nav" data-desktop-workbench-nav aria-label="桌面工作区导航">
  {% for view, label in workbench_destinations %}
    <button type="button" class="{% if view == 'home' %}is-active{% endif %}" data-workbench-view="{{ view }}" {% if view == 'home' %}aria-current="page"{% endif %}>{{ label }}</button>
  {% endfor %}
</nav>
<nav class="mobile-work-nav" data-mobile-work-nav aria-label="移动工作区导航">
  {% for view, label in workbench_destinations %}
    <button type="button" class="{% if view == 'home' %}is-active{% endif %}" data-workbench-view="{{ view }}" data-mobile-work-view="{{ 'overview' if view == 'home' else view }}" {% if view == 'home' %}aria-current="page"{% endif %}>{{ label }}</button>
  {% endfor %}
</nav>
