<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 · Telegram KOL Research</title>
    <link rel="stylesheet" href="{{ request.url_for('static', path='app.css') }}?v={{ asset_version }}" />
    <style>
      .login-shell {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .login-card {
        width: 100%;
        max-width: 360px;
        padding: 28px 24px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }
      .login-card h1 {
        margin: 0 0 4px;
        font-size: 20px;
      }
      .login-subtitle {
        margin: 0 0 20px;
        font-size: 13px;
        opacity: 0.7;
      }
      .login-field {
        display: block;
        margin-bottom: 14px;
        font-size: 13px;
      }
      .login-field input {
        display: block;
        width: 100%;
        margin-top: 6px;
        padding: 10px;
        box-sizing: border-box;
        font-size: 15px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(0, 0, 0, 0.25);
        color: inherit;
      }
      .login-submit {
        width: 100%;
        margin-top: 8px;
        padding: 11px;
        font-size: 15px;
        border-radius: 8px;
        border: 0;
        cursor: pointer;
        background: #2f6fed;
        color: #fff;
      }
      .login-error {
        margin: 0 0 14px;
        padding: 9px 11px;
        border-radius: 8px;
        font-size: 13px;
        background: rgba(220, 60, 60, 0.16);
        border: 1px solid rgba(220, 60, 60, 0.4);
      }
    </style>
  </head>
  <body class="login-page">
    <main class="login-shell">
      <div class="login-card">
        <h1>登录</h1>
        <p class="login-subtitle">Telegram KOL 交易执行台</p>
        {% if error %}
        <p class="login-error" role="alert">{{ error }}</p>
        {% endif %}
        <form method="post" action="/login">
          <input type="hidden" name="next" value="{{ next_path }}" />
          <label class="login-field">
            用户名
            <input
              type="text"
              name="username"
              autocomplete="username"
              autocapitalize="none"
              autocorrect="off"
              spellcheck="false"
              required
              autofocus
            />
          </label>
          <label class="login-field">
            密码
            <input
              type="password"
              name="password"
              autocomplete="current-password"
              required
            />
          </label>
          <button class="login-submit" type="submit">登录</button>
        </form>
      </div>
    </main>
  </body>
</html>
